<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>YouTube Randomizer</title>
  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    body {
      background-color: #1e1e1e;
      color: #f0f0f0;
      font-family: Arial, sans-serif;
    }

    h2 {
      margin-bottom: 10px;
    }

    input {
      margin-right: 4px;
      padding: 4px;
      background: #2a2a2a;
      color: #f0f0f0;
      border: 1px solid #555;
    }

    button {
      background: #333;
      color: #f0f0f0;
      border: 1px solid #555;
      padding: 4px 10px;
      margin: 1px;
      border-radius: 2px;
      cursor: pointer;
    }

    button:hover {
      background: #444;
    }

    /* ========== LAYOUT ========== */

    #main-container {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    #player-container {
      flex: 3;
    }

    /* Match GIF column height to the video */
    #gif-container {
      flex: 1;
      height: 720px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: hidden;
    }

    /* Each GIF gets 50% height */
    #gif-container .tenor-gif-embed {
      flex: 1;
      width: 100%;
      display: flex;
    }

    /* Tenor inserts an iframe → ensure clean scaling */
    #gif-container iframe {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Controls container across entire player width */
    #controls {
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #cachedPlaylists {
      background: #2a2a2a;
      color: #f0f0f0;
      border: 1px solid #555;
      padding: 4px;
    }

    #nowPlaying {
      font-size: 1.2em;
      font-weight: bold;
      margin-bottom: 8px;
    }

    /* ---------- Top controls ---------- */
    #top-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 10px;
    }
    
    #top-controls input {
        flex: 1 1 300px;
    }
    
    #top-controls button {
        white-space: nowrap;
    }
    
    /* Make the player responsive */
    #player iframe {
        max-width: 100%;
    }

    /* ---------- Mobile ---------- */
    @media (max-width: 900px) {
    
        #main-container {
            flex-direction: column;
        }
    
        #gif-container {
            width: 100%;
            height: auto;
            flex-direction: row;
            gap: 10px;
        }
    
        #gif-container .tenor-gif-embed {
            flex: 1;
            min-height: 180px;
        }
    
        #controls {
            flex-wrap: wrap;
        }
    
        #cachedPlaylists {
            width: 100%;
            margin-top: 8px;
        }
    
        button,
        input,
        select {
            font-size: 16px;
            padding: 10px;
        }
    
        #player {
            width: 100% !important;
        }
    }

    #player-wrapper {
      width: 100%;
      max-width: 1280px;
      aspect-ratio: 16 / 9;
    }
    
    #player,
    #player iframe {
        width: 100% !important;
        height: 100% !important;
    }
  </style>
</head>

<body>

  <h2>YouTube Randomizer</h2>
  <div id="top-controls">
    <input id="apiKey" placeholder="Enter YouTube API key">
    <input id="playlistId" placeholder="Enter YouTube Playlist URL or ID">
    <button id="loadPlaylist">Load & Shuffle Playlist</button>
    <button id="refreshPlaylist">Force Refresh</button>
  </div>

  <div id="status"></div>

  <div id="nowPlaying">Currently playing: –</div>

  <div id="main-container">

    <!-- Player -->
    <div id="player-container">
      <div id="player-wrapper">
        <div id="player"></div>
      </div>

      <div id="controls">
        <button id="prevVideo" tabindex="-1">Previous</button>
        <button id="nextVideo" tabindex="-1">Next</button>

        <label for="cachedPlaylists" style="margin-left:15px;">Switch Playlist:</label>
        <select id="cachedPlaylists">
          <option value="">-- Select cached playlist --</option>
        </select>
      </div>
    </div>

    <!-- GIFs -->
    <div id="gif-container">
      <!-- Filled dynamically -->
    </div>

  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="/Youtube/script.js"></script>

</body>
</html>
