<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Youtube Randomizer</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
  #controls { margin-top: 10px; }
  #cachedPlaylists { margin-top: 10px; }
  </style>
  <style>
    body {
      background-color: #1e1e1e; /* dark gray */
      color: #f0f0f0;           /* light text for readability */
      font-family: Arial, sans-serif;
    }

    button {
      background: #333;
      color: #f0f0f0;
      border: 1px solid #555;
      padding: 4px 10px;
      margin: 1px;
      border-radius: 2px;
      cursor: pointer;
    }

    button:hover {
      background: #444;
    }
  </style>
</head>
<body>
  <h2>Youtube Randomizer</h2>

  <input id="apiKey" placeholder="Enter YouTube API key">
  <input id="playlistId" placeholder="Enter YouTube Playlist URL or ID">
  <button id="loadPlaylist">Load & Shuffle Playlist</button>
  <button id="refreshPlaylist">Force Refresh (use only when necessary)</button>

  <div id="status"></div>
  <div id="nowPlaying" style="
        text-align: start;
        font-size: 1.2em;
        font-weight: bold;
        margin-bottom: 8px;
        color: #f0f0f0;
      ">
        Currently playing: –
  </div>

  <div id="main-container" style="display:flex; gap:10px; align-items:flex-start;">
    
    <!-- Player + Controls -->
    <div id="player-container" style="flex:3;">
        <div id="player"></div>

        <!-- Controls + Playlist Selector in one row -->
        <div style="
            display:flex;
            align-items:center;
            margin-top:10px;
            gap:12px;
        ">
            <div id="controls">
                <button id="prevVideo" tabindex="-1">Previous</button>
                <button id="nextVideo" tabindex="-1">Next</button>
            </div>

            <div>
                <label for="cachedPlaylists">Switch Playlist:</label>
                <select id="cachedPlaylists">
                    <option value="">-- Select cached playlist --</option>
                </select>
            </div>
        </div>
    </div>

    <!-- GIFs (auto-resized to match video height) -->
    <div id="gif-container" style="
        flex:1;
        height:720px;
        display:flex;
        flex-direction:column;
        justify-content:space-between;
    ">
        <!-- Filled dynamically -->
    </div>
  </div>
  
  <div>
    <label for="cachedPlaylists">Switch Playlist:</label>
    <select id="cachedPlaylists">
      <option value="">-- Select cached playlist --</option>
    </select>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="/Youtube/script.js"></script>
</body>
</html>
